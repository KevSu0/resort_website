version: '3.8'

services:
  # PostgreSQL Database (for development/testing)
  postgres:
    image: postgres:15-alpine
    container_name: resort-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resort_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - resort-cms-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: resort-cms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - resort-cms-network

  # Adminer (Database Management UI)
  adminer:
    image: adminer:4
    container_name: resort-cms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - resort-cms-network

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: resort-cms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - resort-cms-network

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: resort-cms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resort_cms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
      - redis
    networks:
      - resort-cms-network
    command: npm run dev

  # Database Migration Service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: resort-cms-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resort_cms
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - resort-cms-network
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma db push &&
        npm run db:seed
      "

volumes:
  postgres_data:
  redis_data:

networks:
  resort-cms-network:
    driver: bridge